<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turnos, búsqueda y salida</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10}hyperframes-player{display:block;width:100%;height:100%}</style></head><body><hyperframes-player src="./composition.html" controls></hyperframes-player><script src="../shared/player.js"></script><script src="../shared/guide-performance-v2.js"></script><script>
const p=document.querySelector('hyperframes-player'),q=new URLSearchParams(location.search);let ready=false,started=false,last=0;const send=(type,extra={})=>parent.postMessage({source:'estacionamiento-guia',type,...extra},location.origin);const execute=d=>{if(d.action==='seek'&&Number.isFinite(d.time))p.seek(Math.max(0,Math.min(d.time,p.duration||d.time)));if(d.action==='play'){p.muted=false;Promise.resolve(p.play()).catch(()=>send('blocked'))}if(d.action==='pause')p.pause()};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.source!=='estacionamiento-aprender')return;if(ready)execute(e.data)});const timer=setInterval(()=>{if(!ready&&p.ready&&p.assetsReady){const w=p.iframeElement?.contentWindow;if(!w||Object.keys(w.__timelines||{}).length<=w.document.querySelectorAll('[data-composition-src]').length)return;window.EstacionamientoPerformance.optimize(w);ready=true;const t=Number(q.get('t')||0);if(t>0)p.seek(t);send('ready',{duration:p.duration});if(q.get('autoplay')==='1')execute({action:'play'})}if(ready){send('state',{time:p.currentTime||0,duration:p.duration||0,paused:p.paused,ended:p.currentTime>=p.duration-.2});last=Date.now()}},700);setTimeout(()=>{if(!ready)send('loading-slow')},45000);window.addEventListener('pagehide',()=>{clearInterval(timer);p.pause()});</script></body></html>
